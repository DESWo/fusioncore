name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # allows manual runs from the Actions tab

# The build output is published straight from the run, so nothing built ever
# has to be committed. This replaces the old hand-copied docs/ folder, which
# silently drifted six days behind the source.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes an older queued one, but
# an in-flight deploy is allowed to finish rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the physics still balances
        # 59 headless checks over the reactor engine, the level progression,
        # the tolerance model and the scorecard. A red suite must not ship.
        run: npm run balance

      - name: Verify the career systems still hold
        # Career mode has its own deterministic assertions: the probability
        # table, no-dice resolution, relationship threading, and full seeded
        # playthroughs to 65. Only balance ran here, so a commit could break
        # every one of them and still deploy green.
        run: npm run career

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
